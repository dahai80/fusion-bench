name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-bench \
            --class platform --entry service \
            --skip-dirs ".git,node_modules,.venv,.pytest_cache,.ruff_cache,.remember,.superpowers,.claude,fusion_bench.egg-info,logs,bench-site,vendor,results,docs/api"
