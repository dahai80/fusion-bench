# GitHub Actions CI — lint + test
# Importers/callers: GitHub Actions runner on push/PR.
# Affected API: none. Data schemas: none.
# User instruction: "生成doc文档，更新README，提交代码仓，建设CI和lint，确保全绿，发布0.3.0版本"
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench-site/**"
      - "benchmarks/results/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench-site/**"
      - "benchmarks/results/**"
      - "LICENSE"
      - ".gitignore"

# Issue #45 (fusion#2 CI retrofit): cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PII scan golden set (issue #49 — fail build on hit)
        run: |
          pip install --no-deps .
          python -c "
          import sys
          from fusion_bench.golden.pii_scan import scan_dir
          hits = scan_dir('benchmarks/golden')
          for h in hits:
              print(f\"PII HIT {h['kind']} in {h['file']}:{h['line']} (case {h['case_id']}): {h['masked']}\")
          sys.exit(1 if hits else 0)
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fusion-core (not on PyPI; issue #37 keeps pin out of package metadata)
        run: pip install "git+https://github.com/dahai80/fusion-core.git@v0.9.0"
      - name: Install with test deps
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Check test count badge (issue #30 drift guard)
        run: python scripts/check_test_count.py
