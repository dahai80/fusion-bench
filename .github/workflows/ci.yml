# GitHub Actions CI — lint + test
# Importers/callers: GitHub Actions runner on push/PR.
# Affected API: none. Data schemas: none.
# User instruction: "生成doc文档，更新README，提交代码仓，建设CI和lint，确保全绿，发布0.3.0版本"
name: CI

# workflow_dispatch: manual runs (badge-only pushes are paths-ignored and
# otherwise leave a PR stuck on a stale failing check).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench-site/**"
      - "benchmarks/results/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench-site/**"
      - "benchmarks/results/**"
      - "LICENSE"
      - ".gitignore"

# Issue #45 (fusion#2 CI retrofit): cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PII scan golden set (issue #49 — fail build on hit)
        run: |
          python - <<'EOF'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location("pii_scan", "fusion_bench/golden/pii_scan.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          hits = mod.scan_dir("benchmarks/golden")
          for h in hits:
              print(f"PII HIT {h['kind']} in {h['file']}:{h['line']} (case {h['case_id']}): {h['masked']}")
          sys.exit(1 if hits else 0)
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fusion-core (not on PyPI; issue #37 keeps pin out of package metadata)
        run: pip install "git+https://github.com/dahai80/fusion-core.git@v0.9.0"
      - name: Install with test + rival deps (compare-suite langgraph arm, issue #53)
        run: pip install -e ".[test,rival]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Check test count badge (issue #30 drift guard)
        run: python scripts/check_test_count.py
