# GitHub Actions CI — lint + test
# Importers/callers: GitHub Actions runner on push/PR.
# Affected API: none. Data schemas: none.
# User instruction: "生成doc文档，更新README，提交代码仓，建设CI和lint，确保全绿，发布0.3.0版本"
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fusion-core (not on PyPI; issue #37 keeps pin out of package metadata)
        run: pip install "git+https://github.com/dahai80/fusion-core.git@v0.9.0"
      - name: Install with test deps
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Check test count badge (issue #30 drift guard)
        run: python scripts/check_test_count.py
